<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临床试验随机化</title>
<style>
body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}
select,button,input{padding:8px;margin:4px}
pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}
.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin-bottom:16px}
.panel h2{margin-top:0;font-size:18px}
.hold{background:#fff3cd;border:1px solid #e0a800;padding:8px;border-radius:6px}
table{border-collapse:collapse;width:100%;margin-bottom:12px}
td,th{border:1px solid #ccc;padding:4px 8px;text-align:left;font-size:14px}
</style></head>
<body><h1>临床试验随机分配与盲法</h1>
<div class="panel">
<select id="user"><option>site1</option><option>site2</option><option>coord</option><option>monitor1</option><option>monitor2</option></select>
试验ID <input id="trial" value="1" size="4">
<button onclick="load()">查看试验摘要</button>
<button onclick="listParticipants()">受试者列表</button>
</div>
<div id="status"></div>
<div class="panel"><h2>协调员：入组控制</h2>
<input id="pauseReason" placeholder="暂停原因（安全信号说明）" size="42">
<button onclick="pauseTrial()">暂停入组</button><br>
<input id="resumeNote" placeholder="整改处理说明" size="42">
<button onclick="resumeTrial()">恢复入组</button>
</div>
<div class="panel"><h2>中心：受试者入组</h2>
<input id="extId" placeholder="外部受试者编号">
<input id="factors" value='{"risk":"low"}' size="24" title="分层因素 JSON">
<button onclick="enroll()">入组</button>
</div>
<div class="panel"><h2>中心：登记完成 / 退出</h2>
受试者ID <input id="outcomePid" size="6">
<select id="outcome"><option value="completed">完成</option><option value="withdrawn">退出</option></select>
<input id="outcomeReason" placeholder="原因" size="28">
<input id="outcomeAt" placeholder="时间(可选, 如 2026-09-26)" size="20">
<button onclick="registerOutcome()">登记结局</button>
</div>
<div class="panel"><h2>揭盲</h2>
受试者ID <input id="ubPid" size="6">
<input id="ubReason" placeholder="揭盲原因（至少 8 字）" size="30">
<button onclick="requestUnblinding()">申请揭盲</button><br>
申请ID <input id="ubReq" size="6">
<button onclick="approveUnblinding()">审批揭盲（两人各点一次）</button>
</div>
<div class="panel"><h2>变更记录</h2><div id="records">点击“查看试验摘要”加载</div></div>
<pre id="out"></pre>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{"X-User-Id":$("user").value,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error?`${j.error.message} [${j.error.code}]`:("HTTP "+r.status));
  return j;
}
function show(x){$("out").textContent=typeof x==="string"?x:JSON.stringify(x,null,2)}
async function run(fn){try{await fn()}catch(e){show("错误："+e.message)}}
async function load(){await run(async()=>{
  const s=await api("GET",`/api/trials/${$("trial").value}/summary`);
  const t=s.trial;
  let html=`<p>试验 <b>${esc(t.name)}</b>（方案 ${esc(t.protocol_version)}） 状态：${esc(t.status)}；入组状态：<b>${esc(s.enrollment)}</b></p>`;
  if(s.active_hold) html+=`<p class="hold">当前阻断原因：${esc(s.active_hold.reason)}（${esc(s.active_hold.created_at)} 由 ${esc(s.active_hold.actor_id)} 登记）</p>`;
  $("status").innerHTML=html;
  const holds=s.holds.map(h=>`<tr><td>${esc(h.created_at)}</td><td>${h.action==="pause"?"暂停入组":"恢复入组"}</td><td>${esc(h.reason)}</td><td>${esc(h.actor_id)}</td></tr>`).join("");
  const audits=s.audit.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.action)}</td><td>${esc(a.actor_id)}</td><td>${esc(JSON.stringify(a.detail))}</td></tr>`).join("");
  $("records").innerHTML=`<h3>暂停 / 恢复记录</h3><table><tr><th>时间</th><th>操作</th><th>原因 / 处理说明</th><th>操作人</th></tr>${holds||"<tr><td colspan=4>无</td></tr>"}</table>`
    +`<h3>审计与结局变更记录</h3><table><tr><th>时间</th><th>动作</th><th>操作人</th><th>明细</th></tr>${audits||"<tr><td colspan=4>无</td></tr>"}</table>`;
  show(s);
})}
async function pauseTrial(){await run(async()=>{show(await api("POST",`/api/trials/${$("trial").value}/pause`,{reason:$("pauseReason").value}));await load()})}
async function resumeTrial(){await run(async()=>{show(await api("POST",`/api/trials/${$("trial").value}/resume`,{note:$("resumeNote").value}));await load()})}
async function enroll(){await run(async()=>{
  let factors; try{factors=JSON.parse($("factors").value)}catch{throw new Error("分层因素必须是 JSON 对象")}
  show(await api("POST",`/api/trials/${$("trial").value}/enroll`,{external_id:$("extId").value,factors}));await load();
})}
async function registerOutcome(){await run(async()=>{
  const body={outcome:$("outcome").value,reason:$("outcomeReason").value};
  if($("outcomeAt").value.trim()) body.occurred_at=$("outcomeAt").value.trim();
  show(await api("POST",`/api/participants/${$("outcomePid").value}/outcome`,body));await load();
})}
async function requestUnblinding(){await run(async()=>{show(await api("POST",`/api/participants/${$("ubPid").value}/unblinding-requests`,{reason:$("ubReason").value}))})}
async function approveUnblinding(){await run(async()=>{show(await api("POST",`/api/unblinding-requests/${$("ubReq").value}/approve`))})}
async function listParticipants(){await run(async()=>{show(await api("GET",`/api/trials/${$("trial").value}/participants`))})}
</script></body></html>
